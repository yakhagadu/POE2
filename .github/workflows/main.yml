name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:    # allows manual trigger from the Actions tab

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install .NET 8 SDK
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Cache NuGet packages to speed up future runs
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 4. Restore all NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      # 5. Build the entire solution in Release mode
      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      # 6. Run all unit tests
      - name: Run tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

      # 7. Verify the /docs folder from Part 1 exists (Part 1 requirement)
      - name: Verify Part 1 docs exist
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ /docs folder is missing"
            exit 1
          fi
          for f in docs/erd.png docs/api-endpoint-plan.md docs/raceday-schema.sql; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing required file: $f"
              exit 1
            fi
          done
          echo "✅ All Part 1 docs are present"

      # 8. Upload test results as an artefact (optional but useful)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
